<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCM360 - Login</title>
    
    <!-- Configurações para PWA / App Instalável -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PCM360">

    <!-- Importação do Tailwind CSS via CDN para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilização da imagem de fundo fixa na tela inteira */
        body {
            background-image: url('fundo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: translateY(20px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
            50% { box-shadow: 0 0 25px rgba(16, 185, 129, 0.5); }
        }

        .animate-card-entry {
            animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .btn-pulse-glow {
            animation: pulseGlow 3s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity duration-700"></div>

    <div class="relative z-10 w-full max-w-md bg-slate-900/85 border border-slate-700/50 rounded-2xl shadow-2xl p-8 backdrop-blur-md animate-card-entry">
        
        <div class="text-center mb-6 flex justify-center items-center">
            <img src="logo-pcm360.png" alt="PCM360 - GESTÃO" class="h-18 object-contain">
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Usuário / Matrícula</label>
                <input type="text" id="usuario" required 
                    class="w-full px-4 py-3 bg-slate-800/60 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
                    placeholder="Digite seu usuário">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Senha</label>
                <div class="relative">
                    <input type="password" id="senha" required 
                        class="w-full px-4 py-3 pr-12 bg-slate-800/60 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
                        placeholder="••••••••">
                    <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-white transition">
                        <svg id="eyeShow" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="eyeHide" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.07 10.07 0 014.212-5.036m3.565-1.127A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-slate-300 cursor-pointer">
                    <input type="checkbox" id="lembrar" class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-emerald-600 focus:ring-emerald-500 focus:ring-offset-slate-900">
                    <span class="ml-2">Lembrar-me</span>
                </label>
                <a href="#" id="recuperarSenhaBtn" class="text-emerald-400 hover:text-emerald-300 transition">Esqueceu sua senha?</a>
            </div>

            <div id="errorMessage" class="hidden text-rose-400 text-sm text-center bg-rose-950/40 border border-rose-800/50 py-2 rounded-lg transition-all"></div>

            <button type="submit" id="btnEntrar"
                class="w-full py-4 px-5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg shadow-lg hover:shadow-emerald-500/25 btn-pulse-glow transition duration-300 transform active:scale-98">
                * ENTRAR *
            </button>
        </form>
    </div>

    <!-- MODAL DE RECUPERAÇÃO DE SENHA -->
    <div id="recoveryModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-6 shadow-2xl relative animate-card-entry">
            <h3 class="text-xl font-bold text-white mb-2">RECUPERAR SENHA</h3>
            <p class="text-slate-400 text-sm mb-4">Informe sua Matrícula. O pedido será enviado diretamente via WhatsApp para o Administrador.</p>
            <input type="text" id="recoveryUser" placeholder="Matrícula" class="w-full px-4 py-3 bg-slate-800/60 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 mb-4">
            <div id="recoveryMessage" class="hidden text-sm mb-3 text-center py-2 rounded-lg"></div>
            <div class="flex space-x-3">
                <button type="button" id="closeModal" class="flex-1 py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-lg transition">Cancelar</button>
                <button type="button" id="sendRecovery" class="flex-1 py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg transition">Enviar via WhatsApp</button>
            </div>
        </div>
    </div>

    <script>
        // URL do Web App do Google Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzm9jYbJH_l-J2nlp34y_V2pZVYhaXKyMbvqE-Ei6cQzvZ1deUYrPpXWzdanSEflDjt/exec";

        const togglePassword = document.getElementById('togglePassword');
        const senhaInput = document.getElementById('senha');
        const eyeShow = document.getElementById('eyeShow');
        const eyeHide = document.getElementById('eyeHide');

        togglePassword.addEventListener('click', () => {
            const type = senhaInput.getAttribute('type') === 'password' ? 'text' : 'password';
            senhaInput.setAttribute('type', type);
            eyeShow.classList.toggle('hidden');
            eyeHide.classList.toggle('hidden');
        });

        const recuperarBtn = document.getElementById('recuperarSenhaBtn');
        const recoveryModal = document.getElementById('recoveryModal');
        const closeModal = document.getElementById('closeModal');
        const sendRecovery = document.getElementById('sendRecovery');
        const recoveryMessage = document.getElementById('recoveryMessage');

        recuperarBtn.addEventListener('click', (e) => {
            e.preventDefault();
            recoveryModal.classList.remove('hidden');
        });

        closeModal.addEventListener('click', () => {
            recoveryModal.classList.add('hidden');
            recoveryMessage.classList.add('hidden');
            document.getElementById('recoveryUser').value = '';
        });

        sendRecovery.addEventListener('click', () => {
            const userVal = document.getElementById('recoveryUser').value.trim();
            if(userVal === '') {
                recoveryMessage.textContent = 'Por favor, informe a Matrícula.';
                recoveryMessage.className = 'text-rose-400 text-sm mb-3 bg-rose-950/40 border border-rose-800/50 py-2 rounded-lg';
                recoveryMessage.classList.remove('hidden');
                return;
            }

            recoveryMessage.textContent = 'Redirecionando para o WhatsApp do suporte...';
            recoveryMessage.className = 'text-emerald-400 text-sm mb-3 bg-emerald-950/40 border border-emerald-800/50 py-2 rounded-lg';
            recoveryMessage.classList.remove('hidden');

            const numeroWhatsAppMaster = "5585981665884"; 
            const mensagemZap = encodeURIComponent(`🚨 *PCM-360 - Pedido de Recuperação de Senha*\n\nO usuário solicitou ajuda informando:\n*Matrícula:* ${userVal}\n*Data:* ${new Date().toLocaleString('pt-BR')}`);
            
            setTimeout(() => {
                recoveryModal.classList.add('hidden');
                recoveryMessage.classList.add('hidden');
                document.getElementById('recoveryUser').value = '';
                window.open(`https://wa.me/${numeroWhatsAppMaster}?text=${mensagemZap}`, '_blank');
            }, 1500);
        });

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const lembrarCheckbox = document.getElementById('lembrar');
        const usuarioInput = document.getElementById('usuario');
        const btnEntrar = document.getElementById('btnEntrar');

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('pcm_saved_user');
            if (savedUser) {
                usuarioInput.value = savedUser;
                lembrarCheckbox.checked = true;
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.classList.add('hidden');
            
            const usuarioVal = usuarioInput.value.trim();
            const senhaVal = senhaInput.value.trim();

            if (lembrarCheckbox.checked) {
                localStorage.setItem('pcm_saved_user', usuarioVal);
            } else {
                localStorage.removeItem('pcm_saved_user');
            }

            btnEntrar.disabled = true;
            btnEntrar.classList.remove('btn-pulse-glow');
            btnEntrar.textContent = 'Verificando acesso...';

            // Atalho direto do Master
            if (usuarioVal.toLowerCase() === 'eraldo' && senhaVal === '00000001') {
                localStorage.setItem('pcm_usuario', JSON.stringify({
                    nome: 'Eraldo',
                    cargo: 'master',
                    idEmpresa: 1
                }));
                window.location.href = '0painel-master.html';
                return;
            }

            // Validação de Empresas cadastradas na Planilha via Apps Script
            try {
                const resposta = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        acao: 'fazerLogin',
                        usuario: usuarioVal,
                        senha: senhaVal
                    })
                });

                const respostaLogin = await resposta.json();

                if (respostaLogin && respostaLogin.sucesso) {
                    localStorage.setItem('pcm_usuario', JSON.stringify({
                        nome: respostaLogin.nome || usuarioVal,
                        cargo: respostaLogin.cargo || 'empresa',
                        idEmpresa: respostaLogin.id || 1
                    }));

                    window.location.href = '0painel-master.html';
                } else {
                    errorMessage.textContent = respostaLogin.erro || 'Usuário ou senha incorretos.';
                    errorMessage.classList.remove('hidden');
                    btnEntrar.disabled = false;
                    btnEntrar.classList.add('btn-pulse-glow');
                    btnEntrar.textContent = '* ENTRAR *';
                }

            } catch (error) {
                console.error('Erro no login:', error);
                errorMessage.textContent = 'Erro ao conectar com a planilha de acesso.';
                errorMessage.classList.remove('hidden');
                btnEntrar.disabled = false;
                btnEntrar.classList.add('btn-pulse-glow');
                btnEntrar.textContent = '* ENTRAR *';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCM360 - Login</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PCM360">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background-image: url('fundo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: translateY(20px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.3), inset 0 0 15px rgba(16, 185, 129, 0.1); }
            50% { box-shadow: 0 0 35px rgba(16, 185, 129, 0.6), inset 0 0 25px rgba(16, 185, 129, 0.2); }
        }

        .animate-card-entry {
            animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .btn-pulse-glow {
            animation: pulseGlow 3s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    
    <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-md transition-opacity duration-700"></div>

    <div class="relative z-10 w-full max-w-md">
        <div class="absolute -inset-1.5 bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-700 rounded-3xl blur-xl opacity-40 animate-pulse"></div>

        <div class="relative bg-slate-900/95 border border-emerald-500/30 rounded-2xl shadow-2xl p-8 backdrop-blur-2xl animate-card-entry">
            
            <div class="flex items-center justify-between mb-8 pb-6 border-b border-slate-800/80">
                <div class="flex-1 pr-4">
                    <img src="logo-pcm360.png" alt="PCM360 - GESTÃO" class="h-16 w-auto object-contain filter drop-shadow-[0_2px_8px_rgba(16,185,129,0.3)]">
                </div>
                
                <div class="relative flex-shrink-0">
                    <div class="w-20 h-20 rounded-2xl p-1 bg-gradient-to-tr from-emerald-500 via-teal-400 to-slate-700 shadow-2xl flex items-center justify-center overflow-hidden bg-slate-950 border border-emerald-500/40">
                        <img id="userAvatar" src="" alt="Avatar" class="w-full h-full object-cover rounded-xl hidden">
                        <svg id="defaultAvatarIcon" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <div class="absolute -bottom-1 -right-1 w-5 h-5 bg-emerald-500 rounded-full border-4 border-slate-900 shadow-lg flex items-center justify-center" title="Sistema Online">
                        <span class="w-1.5 h-1.5 bg-white rounded-full animate-ping"></span>
                    </div>
                </div>
            </div>

            <!-- FORMULÁRIO DE LOGIN NORMAL -->
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Usuário / Matrícula</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-emerald-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        </span>
                        <input type="text" id="usuario" required 
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-950/70 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition shadow-inner"
                            placeholder="Digite seu usuário">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Senha</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-emerald-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </span>
                        <input type="password" id="senha" required 
                            class="w-full pl-11 pr-12 py-3.5 bg-slate-950/70 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition shadow-inner"
                            placeholder="••••••••">
                        
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-emerald-400 transition">
                            <svg id="eyeShow" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg id="eyeHide" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.07 10.07 0 014.212-5.036m3.565-1.127A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm pt-1">
                    <label class="flex items-center text-slate-300 cursor-pointer select-none">
                        <input type="checkbox" id="lembrar" class="w-4 h-4 rounded bg-slate-950 border-slate-800 text-emerald-600 focus:ring-emerald-500 focus:ring-offset-slate-900">
                        <span class="ml-2 font-medium">Lembrar-me</span>
                    </label>
                    <a href="#" id="recuperarSenhaBtn" class="text-emerald-400 hover:text-emerald-300 font-medium transition">Esqueceu sua senha?</a>
                </div>

                <div id="errorMessage" class="hidden text-rose-400 text-sm text-center bg-rose-950/40 border border-rose-800/50 py-2.5 rounded-xl transition-all"></div>

                <button type="submit" id="btnEntrar"
                    class="w-full py-4 px-5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold tracking-wider rounded-xl shadow-lg shadow-emerald-950/50 btn-pulse-glow transition duration-300 transform active:scale-98 uppercase text-sm">
                    ENTRAR NO SISTEMA
                </button>
            </form>

            <!-- FORMULÁRIO DE CADASTRO DO MASTER -->
            <div id="setupMasterContainer" class="hidden space-y-4">
                <div class="bg-emerald-950/40 border border-emerald-500/40 p-4 rounded-xl text-center">
                    <h3 class="text-emerald-400 font-bold text-base mb-1">⚙ Configuração Inicial</h3>
                    <p class="text-slate-300 text-xs">Nenhum Administrador Master cadastrado. Crie suas credenciais de acesso abaixo:</p>
                </div>
                
                <form id="setupMasterForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Novo Usuário Master</label>
                        <input type="text" id="novoMasterUser" required 
                            class="w-full px-4 py-3 bg-slate-950/70 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-sm"
                            placeholder="Ex: eraldo">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Nova Senha Master</label>
                        <input type="password" id="novoMasterSenha" required 
                            class="w-full px-4 py-3 bg-slate-950/70 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-sm"
                            placeholder="••••••••">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Link da Logo / Foto (Opcional)</label>
                        <input type="text" id="novoMasterLink" 
                            class="w-full px-4 py-3 bg-slate-950/70 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-sm"
                            placeholder="Cole o link do Google Drive">
                    </div>
                    <div id="setupError" class="hidden text-rose-400 text-xs text-center bg-rose-950/40 border border-rose-800/50 py-2 rounded-xl"></div>
                    <button type="submit" id="btnSalvarMaster"
                        class="w-full py-3.5 px-5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold tracking-wider rounded-xl shadow-lg uppercase text-xs transition">
                        CRIAR MASTER E ENTRAR
                    </button>
                </form>
            </div>

        </div>
    </div>

    <!-- MODAL DE RECUPERAÇÃO E ALTERAÇÃO DE DADOS VIA CPF -->
    <div id="recoveryModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="bg-slate-900 border border-emerald-500/30 rounded-2xl w-full max-w-sm p-6 shadow-2xl relative animate-card-entry">
            <h3 class="text-xl font-bold text-white mb-2">RECUPERAR / ALTERAR DADOS</h3>
            <p id="recoveryInstruction" class="text-slate-400 text-sm mb-4">Informe o seu CPF cadastrado para validar a sua identidade.</p>
            
            <!-- Etapa 1: Digitar CPF -->
            <div id="stepCpfContainer">
                <input type="text" id="recoveryCpf" maxlength="14" placeholder="000.000.000-00" oninput="mascaraCPFModal(this)" class="w-full px-4 py-3.5 bg-slate-950/70 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 mb-4">
            </div>

            <!-- Etapa 2: Definir novo Usuário e Senha (Oculto inicialmente) -->
            <div id="stepNewDataContainer" class="hidden space-y-3 mb-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Novo Nome de Usuário</label>
                    <input type="text" id="novoUsuarioInput" placeholder="Ex: novo_usuario" class="w-full px-4 py-3 bg-slate-950/70 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Nova Senha</label>
                    <input type="password" id="novaSenha1" placeholder="••••••••" class="w-full px-4 py-3 bg-slate-950/70 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Confirmar Nova Senha</label>
                    <input type="password" id="novaSenha2" placeholder="••••••••" class="w-full px-4 py-3 bg-slate-950/70 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-sm">
                </div>
            </div>

            <div id="recoveryMessage" class="hidden text-sm mb-3 text-center py-2 rounded-xl"></div>
            
            <div class="flex space-x-3">
                <button type="button" id="closeModal" class="flex-1 py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-xl transition">Cancelar</button>
                <button type="button" id="sendRecovery" class="flex-1 py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl transition">Avançar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://mswszxzeczyusnjccxit.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_-vY5LDwjwPB-BbFO1UCfQw_2ztUDsUp";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function formatarLinkImagem(url) {
            if (!url) return '';
            url = url.trim();
            if (url.includes('drive.google.com')) {
                let fileId = '';
                const matchD = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                const matchId = url.match(/id=([a-zA-Z0-9_-]+)/);
                if (matchD && matchD[1]) fileId = matchD[1];
                else if (matchId && matchId[1]) fileId = matchId[1];
                if (fileId) return `https://drive.google.com/thumbnail?id=${fileId}&sz=w500`;
            }
            return url;
        }

        function mascaraCPFModal(input) {
            let v = input.value.replace(/\D/g, '');
            if (v.length > 11) v = v.substring(0, 11);
            if (v.length > 9) {
                v = v.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, "$1.$2.$3-$4");
            } else if (v.length > 6) {
                v = v.replace(/^(\d{3})(\d{3})(\d{1,3})$/, "$1.$2.$3");
            } else if (v.length > 3) {
                v = v.replace(/^(\d{3})(\d{1,3})$/, "$1.$2");
            }
            input.value = v;
        }

        const togglePassword = document.getElementById('togglePassword');
        const senhaInput = document.getElementById('senha');
        const eyeShow = document.getElementById('eyeShow');
        const eyeHide = document.getElementById('eyeHide');

        if (togglePassword && senhaInput) {
            togglePassword.addEventListener('click', () => {
                const type = senhaInput.getAttribute('type') === 'password' ? 'text' : 'password';
                senhaInput.setAttribute('type', type);
                eyeShow.classList.toggle('hidden');
                eyeHide.classList.toggle('hidden');
            });
        }

        const usuarioInput = document.getElementById('usuario');
        const userAvatar = document.getElementById('userAvatar');
        const defaultAvatarIcon = document.getElementById('defaultAvatarIcon');
        const btnEntrar = document.getElementById('btnEntrar');
        const errorMessage = document.getElementById('errorMessage');

        async function buscarLogoPorUsuario(usuarioVal) {
            if (!usuarioVal) usuarioVal = usuarioInput.value.trim();
            if (usuarioVal.length < 2) {
                userAvatar.classList.add('hidden');
                defaultAvatarIcon.classList.remove('hidden');
                return;
            }

            try {
                // 1. Administradores
                let { data: adminData } = await supabaseClient.from('administradores').select('*').eq('usuario', usuarioVal).single();
                if (adminData && adminData.link_imagem) {
                    userAvatar.src = formatarLinkImagem(adminData.link_imagem);
                    userAvatar.classList.remove('hidden');
                    defaultAvatarIcon.classList.add('hidden');
                    return;
                }

                // 2. Empresas
                let { data: empresas } = await supabaseClient.from('empresas').select('*').eq('usuario', usuarioVal);
                if (empresas && empresas.length > 0 && empresas[0].link_imagem) {
                    userAvatar.src = formatarLinkImagem(empresas[0].link_imagem);
                    userAvatar.classList.remove('hidden');
                    defaultAvatarIcon.classList.add('hidden');
                    return;
                }

                // 3. Responsáveis
                let { data: respData } = await supabaseClient.from('responsaveis').select('*').eq('usuario', usuarioVal).single();
                if (respData && respData.link_imagem) {
                    userAvatar.src = formatarLinkImagem(respData.link_imagem);
                    userAvatar.classList.remove('hidden');
                    defaultAvatarIcon.classList.add('hidden');
                    return;
                }

                // 4. Funcionários
                let { data: funcData } = await supabaseClient.from('funcionarios').select('*').eq('usuario', usuarioVal).single();
                if (funcData && funcData.link_imagem) {
                    userAvatar.src = formatarLinkImagem(funcData.link_imagem);
                    userAvatar.classList.remove('hidden');
                    defaultAvatarIcon.classList.add('hidden');
                    return;
                }

                userAvatar.classList.add('hidden');
                defaultAvatarIcon.classList.remove('hidden');
            } catch (err) {
                userAvatar.classList.add('hidden');
                defaultAvatarIcon.classList.remove('hidden');
            }
        }

        if (usuarioInput) {
            usuarioInput.addEventListener('input', () => {
                buscarLogoPorUsuario();
                errorMessage.classList.add('hidden');
            });
        }
        if (senhaInput) {
            senhaInput.addEventListener('input', () => {
                errorMessage.classList.add('hidden');
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const savedUser = localStorage.getItem('pcm_saved_user');
            if (savedUser) {
                usuarioInput.value = savedUser;
                document.getElementById('lembrar').checked = true;
                buscarLogoPorUsuario(savedUser);
            }

            try {
                const { data } = await supabaseClient.from('administradores').select('*');
                if (!data || data.length === 0) {
                    document.getElementById('loginForm').classList.add('hidden');
                    document.getElementById('setupMasterContainer').classList.remove('hidden');
                }
            } catch (err) {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('setupMasterContainer').classList.remove('hidden');
            }
        });

        const setupMasterForm = document.getElementById('setupMasterForm');
        setupMasterForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const novoUser = document.getElementById('novoMasterUser').value.trim();
            const novaSenha = document.getElementById('novoMasterSenha').value.trim();
            const novoLink = formatarLinkImagem(document.getElementById('novoMasterLink').value.trim());
            const setupError = document.getElementById('setupError');
            setupError.classList.add('hidden');

            try {
                const { error } = await supabaseClient
                    .from('administradores')
                    .insert([{ usuario: novoUser, senha: novaSenha, link_imagem: novoLink }]);

                if (error) throw error;

                localStorage.setItem('pcm_usuario', JSON.stringify({
                    nome: novoUser,
                    cargo: 'master',
                    link_imagem: novoLink,
                    idEmpresa: 1
                }));
                window.location.href = '1cadastro-empresas.html';
            } catch (err) {
                setupError.textContent = 'Erro ao criar master: ' + err.message;
                setupError.classList.remove('hidden');
            }
        });

        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.classList.add('hidden');
            
            const usuarioVal = usuarioInput.value.trim();
            const senhaVal = senhaInput.value.trim();
            const lembrarCheckbox = document.getElementById('lembrar');

            if (lembrarCheckbox.checked) {
                localStorage.setItem('pcm_saved_user', usuarioVal);
            } else {
                localStorage.removeItem('pcm_saved_user');
            }

            btnEntrar.disabled = true;
            btnEntrar.textContent = 'AUTENTICANDO...';

            try {
                // 1. Admin
                const { data: admin } = await supabaseClient.from('administradores').select('*').eq('usuario', usuarioVal).eq('senha', senhaVal).single();
                if (admin) {
                    localStorage.setItem('pcm_usuario', JSON.stringify({ id: 1, idEmpresa: 1, nome: admin.usuario, cargo: 'master', link_imagem: admin.link_imagem || '' }));
                    window.location.href = '1cadastro-empresas.html';
                    return;
                }

                // 2. Empresa
                const { data: empresas } = await supabaseClient.from('empresas').select('*').eq('usuario', usuarioVal).eq('senha', senhaVal);
                if (empresas && empresas.length > 0) {
                    const empresa = empresas[0];
                    if (empresa.status === 'Pausado') throw new Error('⚠️ Acesso da empresa pausado.');
                    localStorage.setItem('pcm_usuario', JSON.stringify({ id: empresa.id, idEmpresa: empresa.id, nome: empresa.nome_empresa, cargo: 'empresa', limite_ids: empresa.limite_ids || 10, link_imagem: empresa.link_imagem || '' }));
                    localStorage.setItem('master_empresa_ativa_id', empresa.id);
                    localStorage.setItem('master_empresa_ativa_nome', empresa.nome_empresa);
                    window.location.href = '0painel-master.html';
                    return;
                }

                // 3. Responsável
                const { data: resp } = await supabaseClient.from('responsaveis').select('*').eq('usuario', usuarioVal).eq('senha', senhaVal).single();
                if (resp) {
                    if (resp.status === 'Pausado') throw new Error('⚠️ Acesso pausado.');
                    localStorage.setItem('pcm_usuario', JSON.stringify({ id: resp.id, idEmpresa: resp.id_empresa, nome: resp.nome, cargo: 'Responsável', link_imagem: resp.link_imagem || '' }));
                    localStorage.setItem('master_empresa_ativa_id', resp.id_empresa);
                    window.location.href = '0painel-master.html';
                    return;
                }

                // 4. Funcionário
                const { data: func } = await supabaseClient.from('funcionarios').select('*').eq('usuario', usuarioVal).eq('senha', senhaVal).single();
                if (func) {
                    if (func.status === 'Pausado') throw new Error('⚠️ Acesso pausado (Férias).');
                    localStorage.setItem('pcm_usuario', JSON.stringify({ id: func.id, idEmpresa: func.id_empresa || func.empresa_id, nome: func.nome, cargo: func.cargo || 'Funcionário', link_imagem: func.link_imagem || '' }));
                    localStorage.setItem('master_empresa_ativa_id', func.id_empresa || func.empresa_id);
                    window.location.href = '0painel-master.html';
                    return;
                }

                throw new Error('❌ Usuário e/ou senha ERRADO!❌');

            } catch (err) {
                errorMessage.textContent = err.message || '❌ Usuário e/ou senha ERRADO!❌';
                errorMessage.classList.remove('hidden');
                btnEntrar.disabled = false;
                btnEntrar.textContent = 'ENTRAR NO SISTEMA';
            }
        });

        // ==========================================
        // LÓGICA DE RECUPERAÇÃO E ALTERAÇÃO DE DADOS VIA CPF
        // ==========================================
        const recuperarBtn = document.getElementById('recuperarSenhaBtn');
        const recoveryModal = document.getElementById('recoveryModal');
        const closeModal = document.getElementById('closeModal');
        const sendRecovery = document.getElementById('sendRecovery');
        const recoveryMessage = document.getElementById('recoveryMessage');
        const recoveryCpfInput = document.getElementById('recoveryCpf');
        const stepCpfContainer = document.getElementById('stepCpfContainer');
        const stepNewDataContainer = document.getElementById('stepNewDataContainer');
        const recoveryInstruction = document.getElementById('recoveryInstruction');
        const novoUsuarioInput = document.getElementById('novoUsuarioInput');

        let etapaRecuperacao = 1; // 1: Validar CPF, 2: Gravar novo usuário e senha
        let usuarioEncontradoRecuperacao = null;

        if (recuperarBtn) {
            recuperarBtn.addEventListener('click', (e) => {
                e.preventDefault();
                etapaRecuperacao = 1;
                usuarioEncontradoRecuperacao = null;
                stepCpfContainer.classList.remove('hidden');
                stepNewDataContainer.classList.add('hidden');
                recoveryInstruction.textContent = 'Informe o seu CPF cadastrado para validar a sua identidade.';
                sendRecovery.textContent = 'Avançar';
                recoveryMessage.classList.add('hidden');
                recoveryCpfInput.value = '';
                recoveryModal.classList.remove('hidden');
            });
        }

        if (closeModal) {
            closeModal.addEventListener('click', () => {
                recoveryModal.classList.add('hidden');
                recoveryMessage.classList.add('hidden');
                recoveryCpfInput.value = '';
                novoUsuarioInput.value = '';
                document.getElementById('novaSenha1').value = '';
                document.getElementById('novaSenha2').value = '';
            });
        }

        if (sendRecovery) {
            sendRecovery.addEventListener('click', async () => {
                recoveryMessage.classList.add('hidden');

                if (etapaRecuperacao === 1) {
                    const cpfVal = recoveryCpfInput.value.trim();
                    if (!cpfVal || cpfVal.length < 14) {
                        recoveryMessage.textContent = '⚠️ Digite um CPF válido.';
                        recoveryMessage.className = 'text-rose-400 text-sm mb-3 bg-rose-950/40 border border-rose-800/50 py-2 rounded-xl';
                        recoveryMessage.classList.remove('hidden');
                        return;
                    }

                    sendRecovery.disabled = true;
                    sendRecovery.textContent = 'A verificar...';

                    try {
                        let encontrado = null;
                        let tabelaAlvo = null;

                        // 1. Procurar em Funcionários
                        const { data: func } = await supabaseClient.from('funcionarios').select('*').eq('cpf', cpfVal).maybeSingle();
                        if (func) { encontrado = func; tabelaAlvo = 'funcionarios'; }

                        // 2. Se não achou, procurar em Responsáveis
                        if (!encontrado) {
                            const { data: resp } = await supabaseClient.from('responsaveis').select('*').eq('cpf', cpfVal).maybeSingle();
                            if (resp) { encontrado = resp; tabelaAlvo = 'responsaveis'; }
                        }

                        // 3. Se não achou, procurar em Empresas
                        if (!encontrado) {
                            const { data: emp } = await supabaseClient.from('empresas').select('*').eq('cpf', cpfVal).maybeSingle();
                            if (emp) { encontrado = emp; tabelaAlvo = 'empresas'; }
                        }

                        if (!encontrado) {
                            throw new Error('❌ CPF não encontrado na base de dados.');
                        }

                        usuarioEncontradoRecuperacao = { 
                            id: encontrado.id, 
                            tabela: tabelaAlvo, 
                            nome: encontrado.nome || encontrado.usuario,
                            usuarioAtual: encontrado.usuario || ''
                        };
                        
                        // Pré-preenche o campo de usuário atual para facilitar
                        novoUsuarioInput.value = usuarioEncontradoRecuperacao.usuarioAtual;

                        // Avança para a Etapa 2 (Definir novo usuário e senha)
                        etapaRecuperacao = 2;
                        stepCpfContainer.classList.add('hidden');
                        stepNewDataContainer.classList.remove('hidden');
                        recoveryInstruction.textContent = `Identidade confirmada (${usuarioEncontradoRecuperacao.nome}). Altere seus dados abaixo:`;
                        sendRecovery.textContent = 'Salvar Alterações';
                        sendRecovery.disabled = false;

                    } catch (err) {
                        recoveryMessage.textContent = err.message || 'CPF não localizado.';
                        recoveryMessage.className = 'text-rose-400 text-sm mb-3 bg-rose-950/40 border border-rose-800/50 py-2 rounded-xl';
                        recoveryMessage.classList.remove('hidden');
                        sendRecovery.disabled = false;
                        sendRecovery.textContent = 'Avançar';
                    }

                } else if (etapaRecuperacao === 2) {
                    const novoUser = novoUsuarioInput.value.trim();
                    const senha1 = document.getElementById('novaSenha1').value.trim();
                    const senha2 = document.getElementById('novaSenha2').value.trim();

                    if (!novoUser) {
                        recoveryMessage.textContent = '⚠️ O nome de usuário não pode estar vazio.';
                        recoveryMessage.className = 'text-rose-400 text-sm mb-3 bg-rose-950/40 border border-rose-800/50 py-2 rounded-xl';
                        recoveryMessage.classList.remove('hidden');
                        return;
                    }

                    if (!senha1 || senha1.length < 4) {
                        recoveryMessage.textContent = '⚠️ A senha deve ter pelo menos 4 caracteres.';
                        recoveryMessage.className = 'text-rose-400 text-sm mb-3 bg-rose-950/40 border border-rose-800/50 py-2 rounded-xl';
                        recoveryMessage.classList.remove('hidden');
                        return;
                    }

                    if (senha1 !== senha2) {
                        recoveryMessage.textContent = '⚠️ As senhas não coincidem.';
                        recoveryMessage.className = 'text-rose-400 text-sm mb-3 bg-rose-950/40 border border-rose-800/50 py-2 rounded-xl';
                        recoveryMessage.classList.remove('hidden');
                        return;
                    }

                    sendRecovery.disabled = true;
                    sendRecovery.textContent = 'A atualizar...';

                    try {
                        const { error } = await supabaseClient
                            .from(usuarioEncontradoRecuperacao.tabela)
                            .update({ 
                                usuario: novoUser, 
                                senha: senha1 
                            })
                            .eq('id', usuarioEncontradoRecuperacao.id);

                        if (error) throw error;

                        recoveryMessage.textContent = '✅ Dados alterados com sucesso! Já pode fazer login.';
                        recoveryMessage.className = 'text-emerald-400 text-sm mb-3 bg-emerald-950/40 border border-emerald-800/50 py-2 rounded-xl';
                        recoveryMessage.classList.remove('hidden');

                        setTimeout(() => {
                            recoveryModal.classList.add('hidden');
                            recoveryMessage.classList.add('hidden');
                            novoUsuarioInput.value = '';
                            document.getElementById('novaSenha1').value = '';
                            document.getElementById('novaSenha2').value = '';
                        }, 2000);

                    } catch (err) {
                        recoveryMessage.textContent = 'Erro ao atualizar dados: ' + err.message;
                        recoveryMessage.className = 'text-rose-400 text-sm mb-3 bg-rose-950/40 border border-rose-800/50 py-2 rounded-xl';
                        recoveryMessage.classList.remove('hidden');
                        sendRecovery.disabled = false;
                        sendRecovery.textContent = 'Salvar Alterações';
                    }
                }
            });
        }
    </script>
</body>
</html>

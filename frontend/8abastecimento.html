<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCM360 - Registo Rápido de Abastecimento</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #051622;
            background-image: linear-gradient(rgba(5, 22, 34, 0.8), rgba(5, 22, 34, 0.9)), url('fundo.png');
            background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
            color: #ffffff; min-height: 100vh; padding: 15px;
        }
        .container { max-width: 650px; margin: 0 auto; background: rgba(8, 30, 48, 0.95); border-radius: 12px; border: 1px solid rgba(249, 115, 22, 0.4); padding: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e3a5f; padding-bottom: 15px; margin-bottom: 20px; }
        .header h2 { color: #f97316; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .btn-voltar { background: #334155; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; transition: background 0.2s; }
        .btn-voltar:hover { background: #475569; }

        /* Perfil do Operador */
        .user-profile-card { display: flex; align-items: center; gap: 12px; background: rgba(2, 12, 20, 0.7); border: 1px solid #1e3a5f; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #f97316; display: flex; align-items: center; justify-content: center; background: #334155; font-weight: bold; color: #f97316; font-size: 16px; }
        .user-info .user-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .user-info .user-name { font-size: 15px; font-weight: bold; color: #fff; }

        .form-group { margin-bottom: 15px; }
        label { font-size: 13px; color: #cbd5e1; font-weight: 600; display: block; margin-bottom: 5px; }
        input, select { 
            width: 100%; padding: 12px; background: rgba(2, 12, 20, 0.9); 
            border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 15px; 
        }
        input:focus, select:focus { outline: none; border-color: #f97316; box-shadow: 0 0 8px rgba(249, 115, 22, 0.4); }
        select option { background: #051622; color: #fff; }

        .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .combo-action-group { display: flex; gap: 8px; }
        .btn-mini-action { background: #1e3a5f; color: #fff; border: 1px solid #334155; padding: 0 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; font-size: 14px; }
        .btn-mini-action:hover { background: #334155; border-color: #f97316; }
        .btn-mini-action.danger:hover { background: #7f1d1d; border-color: #ef4444; }

        .btn-salvar { 
            background: #f97316; color: white; border: none; padding: 15px; border-radius: 8px; 
            font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; transition: opacity 0.2s; margin-top: 10px;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
        }
        .btn-salvar:hover { opacity: 0.9; background: #ea580c; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>⛽ Registo Rápido de Abastecimento</h2>
            <button id="btnVoltarPainel" class="btn-voltar" type="button">⬅ Voltar ao Painel</button>
        </div>

        <!-- Cartão do Operador Logado -->
        <div class="user-profile-card">
            <div id="user-avatar-container">
                <div class="user-avatar" id="user-initials">OP</div>
            </div>
            <div class="user-info">
                <div class="user-label">Operador Responsável</div>
                <div class="user-name" id="user-fullname">A carregar operador...</div>
            </div>
        </div>

        <!-- Linha 1: Máquina/Ativo e Horímetro Inteligente -->
        <div class="row-grid">
            <div class="form-group">
                <label>Máquina / Ativo (0000-00)</label>
                <select id="abast-ativo">
                    <option value="">A carregar ativos...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Horímetro / KM (000000.00)</label>
                <input type="text" id="abast-horimetro" placeholder="Ex: 123.25" onblur="formatarHorimetroInteligente(this)">
            </div>
        </div>

        <!-- Linha 2: Quantidade (Litros) -->
        <div class="form-group">
            <label>Quantidade (Litros)</label>
            <input type="number" step="0.01" id="abast-litros" placeholder="Ex: 150.00">
        </div>

        <!-- Linha 3: Tipo de Combustível com Add/Delete -->
        <div class="form-group">
            <label>Tipo de Combustível</label>
            <div class="combo-action-group">
                <select id="abast-combustivel" style="flex: 1;">
                    <!-- Opções geridas dinamicamente -->
                </select>
                <button type="button" class="btn-mini-action" onclick="adicionarCombustivel()" title="Adicionar novo tipo">➕</button>
                <button type="button" class="btn-mini-action danger" onclick="removerCombustivel()" title="Remover selecionado">🗑️</button>
            </div>
        </div>

        <button id="btn-salvar-abastecimento" class="btn-salvar" type="button">🚀 Gravar Abastecimento Imediato</button>
    </div>

    <script>
        const SUPABASE_URL = "https://mswszxzeczyusnjccxit.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_-vY5LDwjwPB-BbFO1UCfQw_2ztUDsUp";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let operadorNomeGlobal = "Não identificado";

        function obterIdEmpresaAtiva() {
            return localStorage.getItem('master_empresa_ativa_id') || (() => {
                try {
                    const u = JSON.parse(localStorage.getItem('pcm_usuario'));
                    return u?.idEmpresa || u?.id_empresa || u?.empresa_id || null;
                } catch(e) { return null; }
            })();
        }

        window.addEventListener('DOMContentLoaded', () => {
            carregarDadosOperador();
            carregarOpcoesCombustivel();

            document.getElementById('btnVoltarPainel').addEventListener('click', () => {
                window.location.href = '0painel-master.html';
            });

            document.getElementById('btn-salvar-abastecimento').addEventListener('click', salvarAbastecimento);
            carregarAtivosSelect();
        });

        function carregarDadosOperador() {
            const usuarioStr = localStorage.getItem('pcm_usuario');
            if (usuarioStr) {
                try {
                    const u = JSON.parse(usuarioStr);
                    const nome = u.nome || u.nomeCompleto || u.email || "Operador PCM";
                    operadorNomeGlobal = nome;
                    document.getElementById('user-fullname').textContent = nome;

                    // Gerar iniciais ou foto
                    if (u.foto || u.avatar) {
                        document.getElementById('user-avatar-container').innerHTML = `<img src="${u.foto || u.avatar}" class="user-avatar" alt="Foto">`;
                    } else {
                        const iniciais = nome.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
                        document.getElementById('user-initials').textContent = iniciais || 'OP';
                    }
                } catch(e) {
                    document.getElementById('user-fullname').textContent = "Operador Padrão";
                }
            } else {
                document.getElementById('user-fullname').textContent = "Operador Não Identificado";
            }
        }

        /* Preenchimento inteligente do horímetro para 8 dígitos totais (ex: 00123.25) */
        function formatarHorimetroInteligente(input) {
            let val = input.value.trim();
            if (!val) return;
            
            // Remove caracteres inválidos mantendo números e ponto/vírgula
            val = val.replace(',', '.');
            let num = parseFloat(val);
            if (isNaN(num)) return;

            // Formata preenchendo zeros à esquerda para fixar 8 caracteres no total (ex: 00123.25)
            input.value = num.toFixed(2).padStart(9, '0');
        }

        /* Gestão de Combustíveis (Add e Delete) */
        const combustiveisDefault = ["Diesel S10", "Diesel S500", "Gasolina", "Arla 32"];

        function carregarOpcoesCombustivel() {
            let lista = JSON.parse(localStorage.getItem('pcm_tipos_combustivel')) || combustiveisDefault;
            const select = document.getElementById('abast-combustivel');
            select.innerHTML = '';
            lista.forEach(comb => {
                const opt = document.createElement('option');
                opt.value = comb;
                opt.textContent = comb;
                select.appendChild(opt);
            });
        }

        function adicionarCombustivel() {
            let novo = prompt("Digite o nome do novo tipo de combustível:");
            if (novo && novo.trim() !== '') {
                novo = novo.trim();
                let lista = JSON.parse(localStorage.getItem('pcm_tipos_combustivel')) || combustiveisDefault;
                if (!lista.includes(novo)) {
                    lista.push(novo);
                    localStorage.setItem('pcm_tipos_combustivel', JSON.stringify(lista));
                    carregarOpcoesCombustivel();
                    document.getElementById('abast-combustivel').value = novo;
                } else {
                    alert('Este combustível já existe na lista!');
                }
            }
        }

        function removerCombustivel() {
            const select = document.getElementById('abast-combustivel');
            const selecionado = select.value;
            if (!selecionado) return;

            let lista = JSON.parse(localStorage.getItem('pcm_tipos_combustivel')) || combustiveisDefault;
            if (lista.length <= 1) {
                alert('⚠️ Deve manter pelo menos um tipo de combustível.');
                return;
            }

            if (confirm(`Tem certeza que deseja remover "${selecionado}" das opções?`)) {
                lista = lista.filter(item => item !== selecionado);
                localStorage.setItem('pcm_tipos_combustivel', JSON.stringify(lista));
                carregarOpcoesCombustivel();
            }
        }

        async function carregarAtivosSelect() {
            const idEmpresa = obterIdEmpresaAtiva();
            const selectAtivo = document.getElementById('abast-ativo');
            if (!idEmpresa) {
                selectAtivo.innerHTML = '<option value="">Nenhuma empresa ativa</option>';
                return;
            }

            try {
                const { data: ativos, error } = await supabaseClient
                    .from('ativos')
                    .select('id, nome, codigo')
                    .eq('id_empresa', idEmpresa);

                if (error) throw error;

                selectAtivo.innerHTML = '<option value="">Selecione o equipamento (0000-00)...</option>';
                if (ativos && ativos.length > 0) {
                    ativos.forEach(at => {
                        const opt = document.createElement('option');
                        opt.value = at.codigo ? `${at.codigo} - ${at.nome}` : at.nome;
                        opt.textContent = `${at.codigo ? at.codigo + ' - ' : ''}${at.nome}`;
                        selectAtivo.appendChild(opt);
                    });
                } else {
                    selectAtivo.innerHTML = '<option value="Geral">Ativo Geral / Frota</option>';
                }
            } catch (err) {
                selectAtivo.innerHTML = '<option value="Geral">Ativo Geral / Frota</option>';
            }
        }

        async function salvarAbastecimento() {
            const idEmpresa = obterIdEmpresaAtiva();
            const ativo = document.getElementById('abast-ativo').value;
            const combustivel = document.getElementById('abast-combustivel').value;
            const litros = document.getElementById('abast-litros').value;
            const horimetro = document.getElementById('abast-horimetro').value;

            if (!ativo || !litros || !horimetro) {
                alert('⚠️ Preencha a máquina, a quantidade de litros e o horímetro!');
                return;
            }

            try {
                const { error } = await supabaseClient.from('abastecimentos').insert([{
                    id_empresa: idEmpresa,
                    ativo: ativo,
                    operador: operadorNomeGlobal,
                    tipo_combustivel: combustivel,
                    litros: parseFloat(litros),
                    horimetro: horimetro, // Grava como texto formatado inteligente
                    custo_total: 0,
                    data_registo: new Date().toISOString()
                }]);

                if (error) throw error;

                alert('✅ Abastecimento registado com sucesso!');
                document.getElementById('abast-litros').value = '';
                document.getElementById('abast-horimetro').value = '';
                document.getElementById('abast-ativo').selectedIndex = 0;
            } catch (err) {
                alert('❌ Erro ao registar: ' + err.message);
            }
        }
    </script>
</body>
</html>

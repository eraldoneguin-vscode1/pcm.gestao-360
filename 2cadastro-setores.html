<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCM360 - Cadastro de Setores</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #051622;
            background-image: linear-gradient(rgba(5, 22, 34, 0.75), rgba(5, 22, 34, 0.85)), url('fundo.png');
            background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
            color: #ffffff; min-height: 100vh; padding: 15px;
        }
        .container { max-width: 800px; margin: 0 auto; background: rgba(8, 30, 48, 0.9); border-radius: 12px; border: 1px solid rgba(0, 212, 255, 0.3); padding: 25px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e3a5f; padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .header h2 { color: #00d4ff; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .btn-voltar { background: #334155; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: background 0.2s; }
        .btn-voltar:hover { background: #475569; }
        .content-section { background: rgba(2, 12, 20, 0.6); padding: 20px; border-radius: 8px; border: 1px solid #1e3a5f; margin-bottom: 20px; }
        
        .form-row { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 15px; }
        
        input { 
            width: 100%; 
            padding: 10px; 
            background: rgba(2, 12, 20, 0.8); 
            border: 1px solid #1e3a5f; 
            border-radius: 6px; 
            color: #fff; 
            margin-top: 5px; 
            font-size: 14px; 
            text-transform: uppercase; 
        }
        input:focus { outline: none; border-color: #00d4ff; box-shadow: 0 0 8px rgba(0, 212, 255, 0.4); }
        
        .btn-salvar { background: #10b981; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; font-size: 14px; margin-top: 15px; transition: opacity 0.2s; }
        .btn-salvar:hover { opacity: 0.9; }
        .btn-salvar:disabled { background: #64748b; cursor: not-allowed; }

        .setores-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 15px; }
        .setor-card { background: rgba(4, 18, 30, 0.9); border: 1px solid #1e3a5f; border-radius: 8px; padding: 15px; border-left: 4px solid #00d4ff; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 12px; }
            .header h2 { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>⚙️️ PCM360 — Cadastro de Setores <span style="background:#38bdf8; color:#051622; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:bold;">MÓDULO</span></h2>
            <button id="btnVoltarPainel" class="btn-voltar" type="button">⬅ Voltar ao Painel</button>
        </div>

        <div class="content-section">
            <h3 style="color: #38bdf8; margin-bottom: 15px; font-size: 16px;">Cadastrar Novo Setor</h3>
            
            <div class="form-row">
                <div>
                    <label style="font-size:12px; color:#cbd5e1; font-weight:500;">Nome do Setor</label>
                    <input type="text" id="setor-nome" placeholder="Ex: Manutenção Mecânica">
                </div>
            </div>
            
            <button id="btn-salvar-setor" class="btn-salvar" type="button">Salvar Setor na Planilha</button>
        </div>

        <div class="content-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">
                <h3 style="color: #38bdf8; font-size: 16px;">Setores Cadastrados na Planilha</h3>
                <button onclick="carregarSetores()" style="background: #1e3a5f; color: #38bdf8; border: 1px solid #00d4ff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;">🔄 Atualizar Lista</button>
            </div>
            
            <div id="loadingSetores" style="text-align: center; color: #94a3b8; font-size: 13px; padding: 20px;">Carregando setores...</div>
            <div id="gridSetores" class="setores-grid"></div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzm9jYbJH_l-J2nlp34y_V2pZVYhaXKyMbvqE-Ei6cQzvZ1deUYrPpXWzdanSEflDjt/exec";

        function obterIdEmpresaAtiva() {
            const usuario = JSON.parse(localStorage.getItem('pcm_usuario') || '{}');
            if (!usuario.idEmpresa) {
                alert('Sessão expirada ou usuário não logado. Faça login novamente.');
                window.location.href = 'login.html';
                return null;
            }
            return usuario.idEmpresa;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const btnVoltar = document.getElementById('btnVoltarPainel');

            if (btnVoltar) {
                btnVoltar.addEventListener('click', () => {
                    window.location.href = '0painel-master.html';
                });
            }

            document.getElementById('btn-salvar-setor').addEventListener('click', salvarSetor);
            carregarSetores();
        });

        async function salvarSetor() {
            const idEmpresa = obterIdEmpresaAtiva();
            if (!idEmpresa) return;

            const nomeInput = document.getElementById('setor-nome').value.trim();
            const nome = nomeInput.toUpperCase();
            
            if(!nome) {
                alert('Preencha o nome do setor!');
                return;
            }

            const btnSalvar = document.getElementById('btn-salvar-setor');
            btnSalvar.disabled = true;
            btnSalvar.textContent = 'Salvando...';

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        acao: 'cadastrarSetor',
                        idEmpresa: idEmpresa,
                        nome: nome,
                        responsaveis: '' 
                    })
                });

                const res = await response.json();

                if (res && res.sucesso !== false) {
                    alert('Setor cadastrado com sucesso!');
                    document.getElementById('setor-nome').value = '';
                    carregarSetores();
                } else {
                    alert('Erro ao salvar: ' + (res ? res.erro : 'Desconhecido'));
                }
            } catch (erro) {
                alert('Erro de conexão ao salvar.');
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.textContent = 'Salvar Setor na Planilha';
            }
        }

        async function carregarSetores() {
            const idEmpresa = obterIdEmpresaAtiva();
            if (!idEmpresa) return;

            const grid = document.getElementById('gridSetores');
            const loading = document.getElementById('loadingSetores');
            loading.style.display = 'block';
            grid.innerHTML = '';

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        acao: 'listarSetores',
                        idEmpresa: idEmpresa 
                    })
                });
                const res = await response.json();

                loading.style.display = 'none';

                if (res.sucesso && res.setores && res.setores.length > 0) {
                    res.setores.forEach(setor => {
                        const card = document.createElement('div');
                        card.className = 'setor-card';
                        
                        card.innerHTML = `
                            <h4 style="color: #00d4ff; font-size: 15px; margin-bottom: 4px;">📌 ${setor.nome}</h4>
                            <p style="font-size: 11px; color: #94a3b8;">Setor operacional ativo</p>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #64748b; font-size: 13px; padding: 15px;">Nenhum setor cadastrado para esta empresa.</div>';
                }
            } catch (err) {
                loading.style.display = 'none';
                grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #f87171; font-size: 13px; padding: 15px;">Erro ao carregar os dados da planilha.</div>';
            }
        }
    </script>
</body>
</html>
